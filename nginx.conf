server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Comprimir texto para que cargue más rápido
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # No publicar los archivos de configuración ni git
    location ~ /\.            { deny all; }
    location ~* \.(yml|yaml|conf|md|zip)$ { deny all; }

    # Imágenes y videos: caché de 7 días
    location ~* \.(png|jpg|jpeg|gif|webp|svg|mp4|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # CSS y JS: caché corta para que los cambios se vean pronto
    location ~* \.(css|js)$ {
        expires 1h;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
